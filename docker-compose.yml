services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geomind
      POSTGRES_USER: geomind
      POSTGRES_PASSWORD: geomind-dev-only
    ports:
      - "5432:5432"
    volumes:
      - geomind-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geomind -d geomind"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3001
      JWT_SECRET: local-compose-secret-change-me
      DATABASE_URL: postgresql://geomind:geomind-dev-only@postgres:5432/geomind
      ALLOWED_ORIGINS: http://localhost:5173
      STORAGE_DIR: /app/storage
      BILLING_PROVIDER: none
    ports:
      - "3001:3001"
    volumes:
      - geomind-storage:/app/storage

volumes:
  geomind-postgres:
  geomind-storage:
